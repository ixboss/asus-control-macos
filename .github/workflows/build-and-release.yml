name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer || true

      - name: Run Unit Tests (swift test)
        run: |
          swift test -c release 2>&1 | tee swift-test.log
          grep -q "Test Suite 'All tests' passed" swift-test.log

      - name: Build Swift CLI and Core
        run: |
          swift build -c release

      - name: Build AsusBridge Kext
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-kext.sh

      - name: Build ASUSControl.app
        run: |
          ./scripts/build-app.sh

      - name: Package Release Bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./scripts/package-release.sh

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
